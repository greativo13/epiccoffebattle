name: Publish playtest list

on:
  push:
    branches: [main]
    paths:
      - "listak.html"
      - "lista-megosztas.js"
      - ".github/workflows/publish-playtest-list.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare standalone list
        run: |
          mkdir site
          cp listak.html site/index.html
          cp listak.html site/listak.html
          mkdir site/lista
          cp listak.html site/lista/index.html
          cp lista-megosztas.js site/lista-megosztas.js
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
